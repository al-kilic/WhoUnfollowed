services:
  web:
    image: ghcr.io/al-kilic/whounfollowed:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
    # No published port: the server's shared Caddy (/srv/proxy) reaches it over 'edge'.
    networks: [default, edge]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - /srv/ig-tracker/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # plausible:
  #   image: ghcr.io/plausible/community-edition:v2
  #   restart: unless-stopped
  #   env_file: .env
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - /srv/ig-tracker/data/plausible:/var/lib/plausible

  # uptime-kuma:
  #   image: louislam/uptime-kuma:1
  #   restart: unless-stopped
  #   ports:
  #     - "3001:3001"
  #   volumes:
  #     - /srv/ig-tracker/data/uptime-kuma:/app/data

# Caddy (ports 80/443, https certificates) moved out of this project on 2026-11-14.
# It now lives in /srv/proxy on the server and serves every site there; its Caddyfile
# is /srv/proxy/Caddyfile (./Caddyfile here is a reference copy). On the server, umami
# and nocodb also join 'edge'. Create the network once with: docker network create edge
networks:
  edge:
    external: true
