name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: al-kilic/whounfollowed

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          no-cache: true

  smoke-test:
    # Runs the exact image build-and-push just pushed against a real,
    # migrated Postgres, then hits every route. Added 2026-07-22 after
    # /what-is-whounfollowed 500'd in production from a bug that only
    # manifested in a production build (dev mode never caught it, and the
    # image itself built and pushed successfully since it was a runtime bug,
    # not a build error). This is the gate that would have caught it.
    #
    # Caveat: this project's own schema drift note applies here too, prod
    # DDL is sometimes applied manually rather than via migration files (see
    # CLAUDE.md), so this ephemeral DB may not perfectly match prod's actual
    # schema. Still catches the class of bug that caused this job to be
    # added (RSC client/server boundary issues, other prod-only crashes)
    # regardless of schema drift.
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      packages: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: igtracker
          POSTGRES_PASSWORD: smoketest
          POSTGRES_DB: igtracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (only needed to run migrations from source)
        run: pnpm install --frozen-lockfile

      - name: Apply schema to the smoke-test database
        working-directory: apps/web
        env:
          DATABASE_URL: postgresql://igtracker:smoketest@localhost:5432/igtracker
        run: |
          node -e "
            const { drizzle } = require('drizzle-orm/postgres-js');
            const { migrate } = require('drizzle-orm/postgres-js/migrator');
            const postgres = require('postgres');
            const sql = postgres(process.env.DATABASE_URL);
            const db = drizzle(sql);
            migrate(db, { migrationsFolder: 'lib/db/migrations' })
              .then(() => { console.log('migrations applied'); process.exit(0); })
              .catch(e => { console.error(e); process.exit(1); });
          "

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the just-built image
        run: |
          # HOSTNAME must be forced to 0.0.0.0: Next.js standalone's server.js
          # binds to process.env.HOSTNAME if set, and Docker auto-injects
          # HOSTNAME=<container id> into every container, which is not
          # reachable from the host under --network host.
          docker run -d --name smoke --network host \
            -e DATABASE_URL=postgresql://igtracker:smoketest@localhost:5432/igtracker \
            -e NEXT_PUBLIC_SITE_URL=http://localhost:3000 \
            -e NEXT_PUBLIC_PAYMENTS_ENABLED=true \
            -e PORT=3000 \
            -e HOSTNAME=0.0.0.0 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Wait for the server to come up
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ -o /dev/null; then
              echo "server is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server never became ready"
          docker logs smoke
          exit 1

      - name: Crawl every route, fail on any server error
        run: |
          set -uo pipefail
          FAIL=0

          check() {
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$1")
            # 200 = ok, 307/308 = expected auth redirect for logged-out users
            if [[ "$code" == "200" || "$code" == "307" || "$code" == "308" ]]; then
              echo "OK   $code  $1"
            else
              echo "FAIL $code  $1"
              FAIL=1
            fi
          }

          for r in / /about /account /author/alan-kilic /blog /changelog /compare /contact \
                   /cookies /dashboard /diff /forgot-password /history /how-to-export /login \
                   /pricing /privacy /refund /reset-password /results /settings /signup /terms \
                   /verify-email /welcome /what-is-whounfollowed /robots.txt /sitemap.xml; do
            check "$r"
          done

          while IFS= read -r slug; do
            check "/blog/$slug"
          done < <(grep -o "slug: '[^']*'" apps/web/app/blog/posts.ts | sed "s/slug: '//;s/'\$//")

          while IFS= read -r slug; do
            check "/compare/$slug"
          done < <(grep -o "slug: '[^']*'" apps/web/app/compare/comparisons.ts | sed "s/slug: '//;s/'\$//")

          if [ "$FAIL" = "1" ]; then
            echo ""
            echo "=== server logs ==="
            docker logs smoke
            exit 1
          fi

      - name: Tear down
        if: always()
        run: docker rm -f smoke || true

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push, smoke-test]

    steps:
      - uses: actions/checkout@v5

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /srv/ig-tracker
            docker compose pull
            docker compose up -d --remove-orphans
            # Recreated containers can change the pg-proxy IP, which breaks the
            # NocoDB->Postgres DNAT route. Re-apply it to the current proxy IP.
            sudo systemctl restart nocodb-pg-route || true
            docker compose exec -T web node -e "
              const { drizzle } = require('drizzle-orm/postgres-js');
              const { migrate } = require('drizzle-orm/postgres-js/migrator');
              const postgres = require('postgres');
              const sql = postgres(process.env.DATABASE_URL);
              const db = drizzle(sql);
              migrate(db, { migrationsFolder: 'apps/web/lib/db/migrations' })
                .then(() => { console.log('migrations done'); process.exit(0); })
                .catch(e => { console.error(e); process.exit(1); });
            " || true
            docker image prune -f

      - name: Ping IndexNow
        run: |
          sleep 10
          urls=$(curl -s https://whounfollowed.co/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's/<loc>//;s#</loc>##')
          if [ -z "$urls" ]; then
            echo "sitemap.xml returned no URLs, skipping IndexNow ping"
            exit 0
          fi
          url_list=$(printf '%s\n' "$urls" | jq -R . | jq -s .)
          curl -s -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg host "whounfollowed.co" \
              --arg key "7b4b57fafe80eba273936b8272e98d16" \
              --arg keyLocation "https://whounfollowed.co/7b4b57fafe80eba273936b8272e98d16.txt" \
              --argjson urlList "$url_list" \
              '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')" \
            -o /dev/null -w "IndexNow response: %{http_code}\n"
