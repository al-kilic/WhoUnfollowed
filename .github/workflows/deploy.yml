name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: al-kilic/whounfollowed

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - uses: actions/checkout@v5

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /srv/ig-tracker
            docker compose pull
            docker compose up -d --remove-orphans
            # Recreated containers can change the pg-proxy IP, which breaks the
            # NocoDB->Postgres DNAT route. Re-apply it to the current proxy IP.
            sudo systemctl restart nocodb-pg-route || true
            docker compose exec -T web node -e "
              const { drizzle } = require('drizzle-orm/postgres-js');
              const { migrate } = require('drizzle-orm/postgres-js/migrator');
              const postgres = require('postgres');
              const sql = postgres(process.env.DATABASE_URL);
              const db = drizzle(sql);
              migrate(db, { migrationsFolder: 'apps/web/lib/db/migrations' })
                .then(() => { console.log('migrations done'); process.exit(0); })
                .catch(e => { console.error(e); process.exit(1); });
            " || true
            docker image prune -f

      - name: Ping IndexNow
        run: |
          sleep 10
          urls=$(curl -s https://whounfollowed.co/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's/<loc>//;s#</loc>##')
          if [ -z "$urls" ]; then
            echo "sitemap.xml returned no URLs, skipping IndexNow ping"
            exit 0
          fi
          url_list=$(printf '%s\n' "$urls" | jq -R . | jq -s .)
          curl -s -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg host "whounfollowed.co" \
              --arg key "7b4b57fafe80eba273936b8272e98d16" \
              --arg keyLocation "https://whounfollowed.co/7b4b57fafe80eba273936b8272e98d16.txt" \
              --argjson urlList "$url_list" \
              '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')" \
            -o /dev/null -w "IndexNow response: %{http_code}\n"
